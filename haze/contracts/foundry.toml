[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
bytecode_hash = "none"
cbor_metadata = false
solc = "0.8.28"
via_ir = true
optimizer = true
allow_paths = ["../dev/artifacts"]
remappings = [
    "haze-dev/=../dev/artifacts/",
    "haze-operator/=../dev/artifacts/operator-verifier/",
]
fs_permissions = [
    { access = "read", path = "../circuits/vectors" },
    { access = "read", path = "../dev/artifacts" },
]

[invariant]
runs = 48
depth = 12
fail_on_revert = false

