[workspace]
members = [
    "crates/protocol",
    "crates/prover",
    "services/audit-auth",
    "services/disclosure",
    "services/gatekeeper",
    "services/indexer",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.dependencies]
ark-ff = { version = "0.6.0", default-features = false }
cfg-if = { version = "1", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"

