[package]
name = "haze-audit-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Institutional audit authorization service for Haze"

[lib]
name = "haze_audit_auth"
path = "src/lib.rs"

[[bin]]
name = "haze-audit-auth"
path = "src/main.rs"

[dependencies]
haze-protocol = { path = "../../crates/protocol" }
hex = { workspace = true, features = ["alloc", "std"] }
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }
thiserror = "2"

[lints]
workspace = true
