[package]
name = "haze-disclosure"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Scoped audit disclosure service for Haze"

[lib]
name = "haze_disclosure"
path = "src/lib.rs"

[[bin]]
name = "haze-disclosure"
path = "src/main.rs"

[dependencies]
haze-audit-auth = { path = "../audit-auth" }
haze-protocol = { path = "../../crates/protocol" }
hex = { workspace = true, features = ["alloc", "std"] }
thiserror = "2"
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[lints]
workspace = true
