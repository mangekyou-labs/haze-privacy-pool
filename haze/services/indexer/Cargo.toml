[package]
name = "haze-indexer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Finality-aware auditability indexer for Haze"

[lib]
name = "haze_indexer"
path = "src/lib.rs"

[[bin]]
name = "haze-indexer"
path = "src/main.rs"

[dependencies]
haze-protocol = { path = "../../crates/protocol" }
hex = { workspace = true, features = ["alloc", "std"] }
thiserror = "2"

[lints]
workspace = true
