services:
  - type: web
    name: haze-fuji-disclosure
    runtime: rust
    plan: free
    rootDir: haze
    buildCommand: cargo build --release -p haze-disclosure
    startCommand: ./target/release/haze-disclosure
    healthCheckPath: /readyz
    autoDeploy: false
    envVars:
      - key: HAZE_CHAIN_ID
        value: "43113"
      - key: HAZE_FUJI_DEVELOPMENT_BUILD
        value: "true"
      - key: HAZE_APPLICATION_ID
        sync: false
      - key: HAZE_POOL_ADDRESS
        sync: false
      - key: HAZE_POOL_VERSION
        sync: false
      - key: HAZE_FUJI_RPC_URL
        sync: false
      - key: HAZE_FUJI_AUDIT_IKM
        sync: false
      - key: HAZE_VERCEL_ORIGIN
        sync: false
      - key: HAZE_AUDITOR_WALLET
        sync: false
      - key: HAZE_DEPLOYMENT_BLOCK
        sync: false
      - key: HAZE_POLLER_REPLAY_WINDOW
        value: "32"
      - key: DATABASE_URL
        fromDatabase:
          name: haze-compliance-fuji
          property: connectionString

databases:
  - name: haze-compliance-fuji
    plan: basic-256mb
    databaseName: haze_compliance
    user: haze_disclosure
    postgresMajorVersion: "16"
